name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS so that allTests covers the iOS simulator tests as well as Android and wasmJs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Lint and test
        run: ./gradlew ktlintCheck detekt allTests

      - name: Build the Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build the web production bundle
        run: ./gradlew :webApp:wasmJsBrowserDistribution
